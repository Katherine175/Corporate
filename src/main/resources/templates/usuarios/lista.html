<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Usuarios - Luxury</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<header class="topbar"><div class="brand">Luxury</div><nav class="nav"><a th:href="@{/dashboard}">Dashboard</a><a th:href="@{/usuarios}">Usuarios</a><form class="inline" th:action="@{/logout}" method="post"><button type="submit">Salir</button></form></nav></header>
<main class="container">
	<h1>Usuarios</h1>
	<table>
		<thead><tr><th>ID</th><th>Nombre</th><th>Email</th><th>Estado</th><th>Roles</th><th>Detalle</th></tr></thead>
		<tbody>
		<tr th:each="usuario : ${usuarios}">
			<td th:text="${usuario.id}"></td>
			<td th:text="${usuario.nombre}"></td>
			<td th:text="${usuario.email}"></td>
			<td th:text="${usuario.estado}"></td>
			<td th:text="${usuario.roles}"></td>
			<td><a th:href="@{/usuarios/{id}(id=${usuario.id})}">Ver</a></td>
		</tr>
		</tbody>
	</table>
</main>
</body>
</html>
