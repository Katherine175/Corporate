<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Detalle usuario - Luxury</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<header class="topbar"><div class="brand">Luxury</div><nav class="nav"><a th:href="@{/usuarios}">Usuarios</a><a th:href="@{/dashboard}">Dashboard</a></nav></header>
<main class="container">
	<section class="panel">
		<h1 th:text="${usuario.nombre}">Usuario</h1>
		<p><strong>Email:</strong> <span th:text="${usuario.email}"></span></p>
		<p><strong>Estado:</strong> <span th:text="${usuario.estado}"></span></p>
		<p><strong>Roles:</strong> <span th:text="${usuario.roles}"></span></p>
	</section>
</main>
</body>
</html>
