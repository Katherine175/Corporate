<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Registrar consumo - Luxury</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<header class="topbar"><div class="brand">Luxury</div><nav class="nav"><a th:href="@{/consumos}">Consumos</a><a th:href="@{/dashboard}">Dashboard</a></nav></header>
<main class="container">
	<section class="panel">
		<h1>Registrar consumo</h1>
		<form th:action="@{/consumos/registrar}" th:object="${consumoForm}" method="post">
			<div class="grid">
				<div><label>Sede</label><select th:field="*{sedeId}"><option value="">Seleccione</option><option th:each="sede : ${sedes}" th:value="${sede.id}" th:text="${sede.nombre}"></option></select></div>
				<div><label>Recurso</label><select th:field="*{tipoRecursoId}"><option value="">Seleccione</option><option th:each="tipo : ${tiposRecurso}" th:value="${tipo.id}" th:text="${tipo.nombre}"></option></select></div>
				<div><label>Cantidad consumida</label><input type="number" step="0.0001" th:field="*{cantidadConsumida}"></div>
				<div><label>Fecha consumo</label><input type="date" th:field="*{fechaConsumo}"></div>
				<div><label>Periodo</label><input placeholder="2026-05" th:field="*{periodo}"></div>
			</div>
			<button type="submit">Guardar consumo</button>
			<a class="button secondary" th:href="@{/consumos}">Cancelar</a>
		</form>
	</section>
</main>
</body>
</html>
