<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Reportes - Luxury</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<header class="topbar"><div class="brand">Luxury</div><nav class="nav"><a th:href="@{/dashboard}">Dashboard</a><a th:href="@{/reportes/mensual}">Reportes</a><form class="inline" th:action="@{/logout}" method="post"><button type="submit">Salir</button></form></nav></header>
<main class="container">
	<h1>Reporte mensual</h1>
	<section class="panel">
		<form th:action="@{/reportes/mensual}" method="get">
			<label for="periodo">Periodo</label>
			<input id="periodo" name="periodo" placeholder="2026-05" th:value="${periodo}">
			<button type="submit">Consultar</button>
		</form>
	</section>
	<table th:if="${reportes != null}">
		<thead><tr><th>Periodo</th><th>Sede</th><th>Recurso</th><th>Total consumido</th><th>PEN</th><th>USD</th><th>EUR</th></tr></thead>
		<tbody>
		<tr th:each="reporte : ${reportes}">
			<td th:text="${reporte.periodo}"></td>
			<td th:text="${reporte.sede}"></td>
			<td th:text="${reporte.tipoRecurso}"></td>
			<td th:text="${reporte.totalConsumido}"></td>
			<td th:text="${reporte.costoPen}"></td>
			<td th:text="${reporte.costoUsd}"></td>
			<td th:text="${reporte.costoEur}"></td>
		</tr>
		</tbody>
	</table>
</main>
</body>
</html>
