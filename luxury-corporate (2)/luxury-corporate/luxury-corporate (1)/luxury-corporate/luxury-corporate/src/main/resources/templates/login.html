<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Corporate - Ingreso al Sistema</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a2332 0%, #2c3e50 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 550px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #1a2332 0%, #2c3e50 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .logo {
            width: 60px;
            height: 60px;
            background: #f9c74f;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-weight: bold;
            font-size: 24px;
            color: #1a2332;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .login-body {
            padding: 40px 30px;
        }

        .perfil-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .perfil-card {
            cursor: pointer;
            padding: 25px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            text-align: center;
            transition: all 0.3s ease;
            background: white;
        }

        .perfil-card:hover {
            border-color: #3498db;
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(52, 152, 219, 0.15);
        }

        .perfil-card.active {
            border-color: #3498db;
            background: rgba(52, 152, 219, 0.05);
            box-shadow: 0 5px 20px rgba(52, 152, 219, 0.2);
        }

        .perfil-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .perfil-admin .perfil-icon {
            color: #f9c74f;
        }

        .perfil-admin.active {
            background: rgba(249, 199, 79, 0.05);
            border-color: #f9c74f;
        }

        .perfil-admin.active {
            border-color: #f9c74f;
        }

        .perfil-operador .perfil-icon {
            color: #4ecdc4;
        }

        .perfil-operador.active {
            background: rgba(78, 205, 196, 0.05);
            border-color: #4ecdc4;
        }

        .perfil-operador.active {
            border-color: #4ecdc4;
        }

        .perfil-card h3 {
            font-size: 16px;
            font-weight: 600;
            color: #1a2332;
            margin-bottom: 8px;
        }

        .perfil-card p {
            font-size: 12px;
            color: #666;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #1a2332;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(52, 152, 219, 0.3);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background: #fee;
            color: #c00;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .perfil-input {
            display: none;
        }

        .info-acceso {
            background: #f0f8ff;
            padding: 15px;
            border-radius: 6px;
            font-size: 12px;
            color: #333;
            margin-top: 20px;
            border-left: 4px solid #3498db;
        }

        .info-acceso strong {
            display: block;
            margin-bottom: 8px;
            color: #1a2332;
        }

        .info-acceso p {
            margin: 0;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .perfil-selector {
                grid-template-columns: 1fr;
            }

            .login-header {
                padding: 30px 20px;
            }

            .login-body {
                padding: 30px 20px;
            }

            .login-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">SC</div>
                <h1>Smart Corporate</h1>
                <p>Sistema de Gestión Empresarial</p>
            </div>

            <div class="login-body">
                <h2 style="text-align: center; font-size: 18px; margin-bottom: 30px; color: #1a2332;">
                    Selecciona tu Perfil de Acceso
                </h2>

                <form id="loginForm" method="POST" action="/login">
                    <div class="error-message" id="errorMessage"></div>

                    <div th:if="${error}" class="error-message show">
                        <span th:text="${error}"></span>
                    </div>

                    <div class="perfil-selector">
                        <div class="perfil-card perfil-admin" data-rol="ADMINISTRADOR">
                            <div class="perfil-icon">👑</div>
                            <h3>Administrador</h3>
                            <p>Acceso completo al sistema</p>
                        </div>

                        <div class="perfil-card perfil-operador" data-rol="OPERADOR">
                            <div class="perfil-icon">👤</div>
                            <h3>Operador</h3>
                            <p>Acceso restringido por sede</p>
                        </div>
                    </div>

                    <input type="hidden" id="rolSeleccionado" name="rol">

                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="usuario@smartcorp.com" required>
                    </div>

                    <button type="submit" class="btn-login" id="btnLogin">Ingresar al Sistema</button>

                    <div class="info-acceso">
                        <strong>ℹ️ Información de Acceso</strong>
                        <p>El sistema validará tu perfil y permisos automáticamente. Asegúrate de seleccionar el rol correcto.</p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const perfilCards = document.querySelectorAll('.perfil-card');
        const rolInput = document.getElementById('rolSeleccionado');
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');

        // Seleccionar perfil
        perfilCards.forEach(card => {
            card.addEventListener('click', function() {
                perfilCards.forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                rolInput.value = this.getAttribute('data-rol');
                errorMessage.classList.remove('show');
            });
        });

        // Enviar formulario
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const rol = rolInput.value;
            const email = document.getElementById('email').value;

            if (!rol) {
                mostrarError('Por favor, selecciona un perfil de acceso');
                return;
            }

            if (!email) {
                mostrarError('Por favor, ingresa tu correo electrónico');
                return;
            }

            // El formulario se envía al servidor para validar
            this.submit();
        });

        function mostrarError(mensaje) {
            errorMessage.textContent = '❌ ' + mensaje;
            errorMessage.classList.add('show');
        }

        // Pre-seleccionar admin por defecto
        perfilCards[0].classList.add('active');
        rolInput.value = 'ADMINISTRADOR';
    </script>
</body>
</html>
