<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Login - Luxury</title>
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="auth panel">
	<h1>Luxury</h1>
	<p>Ingreso al sistema</p>
	<div class="message" th:if="${successMessage}" th:text="${successMessage}"></div>
	<div class="error" th:if="${param.error}">Credenciales invalidas.</div>
	<div class="message" th:if="${param.logout}">Sesion cerrada correctamente.</div>
	<form th:action="@{/login}" method="post">
		<label for="email">Email</label>
		<input id="email" name="email" type="email" required>
		<label for="password">Password</label>
		<input id="password" name="password" type="password" required>
		<button type="submit">Ingresar</button>
		<a class="button secondary" th:href="@{/registro}">Registrar usuario</a>
	</form>
</main>
</body>
</html>
