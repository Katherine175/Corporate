<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Auditorias - Luxury</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<header class="topbar"><div class="brand">Luxury</div><nav class="nav">
		<a th:href="@{/dashboard}">Dashboard</a>
		<a th:href="@{/sedes}">Sedes</a>
		<a th:href="@{/tipos-recurso}">Recursos</a>
		<a th:href="@{/consumos}">Consumos</a>
		<a th:href="@{/alertas}">Alertas</a>
		<a th:href="@{/reportes/mensual}">Reportes</a>
		<a th:href="@{/tarifas}">Tarifas</a>
		<a th:href="@{/umbrales}">Umbrales</a>
		<a th:href="@{/monedas}">Monedas</a>
		<a th:href="@{/tipos-cambio}">Tipos de cambio</a>
		<a th:href="@{/auditorias}">Auditorias</a>
		<a th:href="@{/eventos-acceso}">Eventos de acceso</a>
		<a th:href="@{/usuarios}">Gestion de usuarios</a>
		<form class="inline" th:action="@{/logout}" method="post"><button type="submit">Salir</button></form>
	</nav></header>
<main class="container">
	<h1>Auditorias</h1>
	<table>
		<thead><tr><th>ID</th><th>Usuario</th><th>Modulo</th><th>Accion</th><th>Tabla</th><th>Registro</th><th>Descripcion</th><th>Fecha</th></tr></thead>
		<tbody>
		<tr th:each="auditoria : ${auditorias}">
			<td th:text="${auditoria.id}"></td>
			<td th:text="${auditoria.usuario}"></td>
			<td th:text="${auditoria.modulo}"></td>
			<td th:text="${auditoria.accion}"></td>
			<td th:text="${auditoria.tablaAfectada}"></td>
			<td th:text="${auditoria.idRegistroAfectado}"></td>
			<td th:text="${auditoria.descripcion}"></td>
			<td th:text="${auditoria.fecha}"></td>
		</tr>
		</tbody>
	</table>
</main>
</body>
</html>
