<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Detalle consumo - Luxury</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<header class="topbar"><div class="brand">Luxury</div><nav class="nav">
		<a th:href="@{/dashboard}">Dashboard</a>
		<a th:href="@{/sedes}">Sedes</a>
		<a th:href="@{/tipos-recurso}">Recursos</a>
		<a th:href="@{/consumos}">Consumos</a>
		<a th:href="@{/alertas}">Alertas</a>
		<a th:href="@{/reportes/mensual}">Reportes</a>
		<a th:href="@{/tarifas}">Tarifas</a>
		<a th:href="@{/umbrales}">Umbrales</a>
		<a th:href="@{/monedas}">Monedas</a>
		<a th:href="@{/tipos-cambio}">Tipos de cambio</a>
		<a th:href="@{/auditorias}">Auditorias</a>
		<a th:href="@{/eventos-acceso}">Eventos de acceso</a>
		<a th:href="@{/usuarios}">Gestion de usuarios</a>
		<form class="inline" th:action="@{/logout}" method="post"><button type="submit">Salir</button></form>
	</nav></header>
<main class="container">
	<h1>Detalle de consumo</h1>
	<div class="panel">
		<p><strong>Sede:</strong> <span th:text="${consumo.sede}"></span></p>
		<p><strong>Recurso:</strong> <span th:text="${consumo.tipoRecurso}"></span></p>
		<p><strong>Cantidad:</strong> <span th:text="${consumo.cantidadConsumida}"></span> <span th:text="${consumo.unidadMedida}"></span></p>
		<p><strong>Periodo:</strong> <span th:text="${consumo.periodo}"></span></p>
	</div>
	<section class="panel">
		<h2>Costos calculados</h2>
		<table>
			<thead><tr><th>Moneda</th><th>Monto</th><th>Tipo de cambio usado</th></tr></thead>
			<tbody>
			<tr th:each="costo : ${consumo.costos}">
				<td th:text="${costo.moneda}"></td>
				<td th:text="${costo.monto}"></td>
				<td th:text="${costo.tipoCambioUsado}"></td>
			</tr>
			</tbody>
		</table>
	</section>
</main>
</body>
</html>
