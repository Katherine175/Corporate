<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Dashboard - Luxury</title>
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
	<div class="brand">Luxury</div>
	<nav class="nav">
		<a th:href="@{/dashboard}">Dashboard</a>
		<a th:href="@{/sedes}">Sedes</a>
		<a th:href="@{/tipos-recurso}">Recursos</a>
		<a th:href="@{/consumos}">Consumos</a>
		<a th:href="@{/alertas}">Alertas</a>
		<a th:href="@{/reportes/mensual}">Reportes</a>
		<a th:href="@{/tarifas}">Tarifas</a>
		<a th:href="@{/umbrales}">Umbrales</a>
		<a th:href="@{/monedas}">Monedas</a>
		<a th:href="@{/tipos-cambio}">Tipos de cambio</a>
		<a th:href="@{/auditorias}">Auditorias</a>
		<a th:href="@{/eventos-acceso}">Eventos de acceso</a>
		<a th:href="@{/usuarios}">Gestion de usuarios</a>
		<form class="inline" th:action="@{/logout}" method="post"><button type="submit">Salir</button></form>
	</nav>
</header>
<main class="container">
	<h1>Dashboard</h1>
	<div class="grid">
		<div class="metric"><span>Sedes</span><strong th:text="${resumen.totalSedes}">0</strong></div>
		<div class="metric"><span>Consumos</span><strong th:text="${resumen.totalConsumos}">0</strong></div>
		<div class="metric"><span>Alertas</span><strong th:text="${resumen.totalAlertas}">0</strong></div>
		<div class="metric"><span>Costo PEN</span><strong th:text="${resumen.costoTotalPen}">0</strong></div>
	</div>
	<section class="panel">
		<h2>Consumo por sede</h2>
		<table>
			<thead><tr><th>Sede</th><th>Total consumido</th></tr></thead>
			<tbody>
			<tr th:each="item : ${consumosPorSede}">
				<td th:text="${item.sede}"></td>
				<td th:text="${item.totalConsumido}"></td>
			</tr>
			</tbody>
		</table>
	</section>
	<section class="panel">
		<h2>Costos por mes</h2>
		<table>
			<thead><tr><th>Periodo</th><th>Moneda</th><th>Total</th></tr></thead>
			<tbody>
			<tr th:each="item : ${costosPorMes}">
				<td th:text="${item.periodo}"></td>
				<td th:text="${item.moneda}"></td>
				<td th:text="${item.total}"></td>
			</tr>
			</tbody>
		</table>
	</section>
</main>
</body>
</html>
